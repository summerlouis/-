<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bao.Dumpling｜人工收银 POS</title><link rel="stylesheet" href="system.css?v=20261027-realtime"><style>dialog{width:min(92vw,480px);border:0;border-radius:18px;box-shadow:0 15px 55px #001d10aa}dialog::backdrop{background:#001e13aa}.choice-card{padding:25px;color:#092b5d;background:#f7fbff}.choice-card h2{margin:5px 0}.choice-card .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.choice-card button{border:1px solid #bfd4eb;border-radius:10px;padding:12px;background:#fff;color:#0b4b94;font-weight:800;cursor:pointer}.choice-card button:hover{background:#e9f3fd}.choice-card .close{float:right;border:0;background:transparent;font-size:23px;padding:0}.pos-service{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.pos-service button{padding:10px;border:1px solid #bcd4ea;border-radius:9px;background:#fff;color:#0c4b92;font-weight:800;cursor:pointer}.pos-service button small{display:block;margin-top:2px;font-weight:500}.pos-service button.selected{background:#e6f2ff;border-color:#0b56a2}</style><link rel="stylesheet" href="usability.css?v=20261027-realtime"><link rel="stylesheet" href="pos-admin.css?v=20261027-realtime"><link rel="stylesheet" href="sync.css?v=20261027-realtime"></head>
<body data-page="pos"><main class="app"><header class="bar"><div><p class="brand">BAO.DUMPLING</p><h1>人工收银工作台 · POS</h1></div><nav><a href="pos.html" class="active">收银 POS</a><a href="index.html">自助点餐</a><a href="kitchen.html">厨房</a><a href="admin.html">管理后台</a><a href="owner.html">历史数据</a></nav></header><p class="note" data-catalog-status role="status"></p><p class="hint">确认实际收到款项后再登记；本系统不自动扣款。输入商品编码后按回车；包子和饺子会继续选择馅料与做法，付款后完整订单自动发送至厨房。</p><section class="layout"><div class="panel"><p class="eyebrow">CASHIER · ENCAISSEMENT</p><h2>商品编码点餐</h2><div class="code-entry"><input id="code-input" placeholder="输入编码，例如 B2" autocomplete="off"><button id="add-code" class="button primary">添加</button></div><div id="pos-catalog" class="catalog"></div></div><aside class="panel"><p class="eyebrow">CURRENT ORDER</p><h2>当前订单 <span id="cart-count" class="pill">0 件</span></h2><div class="pos-service" aria-label="用餐方式"><button type="button" class="selected" data-pos-service="堂食">堂食<small>Sur place</small></button><button type="button" data-pos-service="打包">打包<small>À emporter</small></button></div><div id="pos-cart" class="cart-list"><p class="empty">请输入编码或点击商品。</p></div><div class="total"><span>应收合计</span><strong id="pos-total">0,00 €</strong></div><div class="payment"><button class="button pay selected" data-payment="现金">现金</button><button class="button pay" data-payment="银行卡">银行卡</button><button class="button pay" data-payment="二维码">二维码</button></div><button id="clear-pos" class="button" style="margin-top:10px">清空订单</button><button id="pay-pos" class="button green" style="margin-top:10px;width:100%">已收款，保存订单并发送厨房</button></aside></section></main>
<dialog id="pos-choice"><form method="dialog" class="choice-card"><button class="close" value="cancel" aria-label="关闭">×</button><p id="pos-step" class="eyebrow">选择馅料</p><h2 id="pos-product"></h2><p id="pos-subtitle" class="note"></p><div id="pos-options" class="option-grid"></div></form></dialog>
<script src="/api/runtime.js"></script><script src="catalog.js?v=20261027-realtime"></script><script src="orders.js?v=20261027-realtime"></script><script src="realtime.js?v=20261027-realtime"></script><script src="sync-ui.js?v=20261027-realtime"></script><script src="system.js?v=20261027-realtime"></script><script src="pending-payments.js?v=20261027-realtime"></script><script src="usability.js?v=20261027-realtime"></script></body></html>
